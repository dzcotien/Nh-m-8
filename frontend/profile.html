<!DOCTYPE html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Tài khoản | May Store
  </title>
  <link rel="stylesheet" href="assets/css/tai-khoan.css?v=12">
  
    
 

</head>
 <body>
  <header class="simple-head">
   <a class="brand" href="index.html">
    <img class="brand-logo" src="assets/images/logo-maystore.webp" alt="Biểu tượng May Store" width="46" height="46" />
    <span>
     MAY
     <span class="light">
      STORE
     </span>
     <small>
      CÔNG NGHỆ CHO CUỘC SỐNG
     </small>
    </span>
   </a>
   <a href="index.html">
    ← Quay về cửa hàng
   </a>
  </header>
  <main class="page-wrap">
   <p class="eyebrow">
    TÀI KHOẢN / THÔNG TIN CÁ NHÂN
   </p>
   <h1 class="page-title">
    Thông tin tài khoản
    <span>
     .
    </span>
   </h1>
   <form class="form-panel profile-panel" id="profile-form">
    <div class="form-two">
     <label>
      Họ và tên
      <input name="ho_ten" placeholder="Họ và tên" required=""/>
     </label>
     <label>
      Email
      <input name="email" placeholder="Email" required="" type="email"/>
     </label>
    </div>
    <div class="form-two">
     <label>
      Số điện thoại
      <input name="so_dien_thoai" placeholder="Số điện thoại"/>
     </label>
     <label>
      Ngày sinh
      <input name="ngay_sinh" type="date"/>
     </label>
    </div>
    <label>
     Giới tính
     <select name="gioi_tinh">
      <option value="">
       Chọn giới tính
      </option>
      <option>
       Nam
      </option>
      <option>
       Nữ
      </option>
      <option>
       Khác
      </option>
     </select>
    </label>
    <button class="btn dark">
     LƯU THÔNG TIN　→
    </button>
    <p class="form-message" id="form-message">
    </p>
   </form>
  <section class="form-panel" style="margin-top:28px">
   <h2>Địa chỉ giao hàng</h2>
   <p>Thêm hoặc cập nhật địa chỉ nhận hàng mặc định của bạn.</p>
   <form id="address-form">
    <div class="form-two"><label>Người nhận<input name="nguoi_nhan" required></label><label>Số điện thoại<input name="so_dien_thoai" required></label></div>
    <label>Địa chỉ chi tiết<input name="dia_chi_chi_tiet" placeholder="Số nhà, tên đường" required></label>
    <div class="form-two"><label>Phường / Xã<input name="phuong_xa"></label><label>Quận / Huyện<input name="quan_huyen" required></label></div>
    <label>Tỉnh / Thành phố<input name="tinh_thanh" required></label>
    <label><input type="checkbox" name="mac_dinh" value="1"> Đặt làm địa chỉ mặc định</label>
    <button class="btn dark">LƯU ĐỊA CHỈ</button><p id="address-message"></p>
   </form>
   <div id="address-list" style="margin-top:18px"></div>
  </section>
  </main>
  <script src="assets/js/profile.js"></script>
  <script src="assets/js/pages.js">
  </script>
 </body>
</html>
