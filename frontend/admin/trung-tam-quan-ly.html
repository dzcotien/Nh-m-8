<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trung tâm quản lý | May Store</title><link rel="stylesheet" href="../assets/css/quan-tri.css?v=12"><style>
.manager{max-width:1450px;margin:auto}.manager-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.manager-head h1{margin:8px 0;font-size:34px}.tabs{display:flex;gap:0;border-bottom:1px solid #dce2dc;flex-wrap:wrap}.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:15px 19px;cursor:pointer;font-weight:700;color:#68736c}.tabs button.active{border-color:#6c9b48;color:#20372a}.manager-panel{background:#fff;border:1px solid #dce2dc;padding:22px;margin-top:22px}.manager-table{width:100%;border-collapse:collapse}.manager-table th,.manager-table td{padding:13px 12px;text-align:left;border-bottom:1px solid #e8ece8;font-size:14px}.manager-table th{background:#f3f6f2;color:#526056}.manager-table input,.manager-table select,.manager-form input{padding:9px;border:1px solid #cbd4cb;border-radius:0;max-width:150px}.manager-btn{border:1px solid #233b2c;background:#233b2c;color:white;padding:9px 13px;cursor:pointer}.manager-btn.light{background:white;color:#233b2c}.manager-form{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:18px}.manager-form label{display:grid;gap:6px;font-size:13px}.notice{padding:12px;background:#f1f5ef;margin:12px 0;display:none}.table-scroll{overflow:auto}@media(max-width:700px){.manager-head{display:block}.manager-panel{padding:12px}.tabs button{padding:12px 10px}}
</style><script>
(async()=>{try{const r=await fetch('../../backend/api/session.php',{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!r.ok||j.nguoi_dung?.vai_tro!=='quan_tri')location.replace('../login.html');}catch{location.replace('../login.html');}})();
</script>

</head><body class="admin-body"><aside class="admin-sidebar"><a class="brand" href="dashboard.html"><img class="brand-logo" src="../assets/images/logo-maystore.webp" alt="Biểu tượng May Store" width="46" height="46" /><span>MAY <span class="light">STORE</span><small>TRUNG TÂM QUẢN TRỊ</small></span></a><p class="side-label">QUẢN LÝ CỬA HÀNG</p><a class="side-link" href="dashboard.html">▦　Bảng điều khiển</a><a class="side-link" href="products.html">▣　Sản phẩm</a><a class="side-link active" href="trung-tam-quan-ly.html">▤　Quản lý dữ liệu</a><div class="sidebar-bottom"><a href="../index.html">← Xem cửa hàng</a><button onclick="fetch('../../backend/api/logout.php',{method:'POST',credentials:'same-origin'}).then(()=>location.href='../login.html')">Đăng xuất ↗</button></div></aside><main class="admin-main"><div class="manager"><header class="manager-head"><div><span class="breadcrumb">MAY STORE / QUẢN TRỊ / DỮ LIỆU</span><h1>Trung tâm quản lý</h1><p>Quản lý đơn hàng, khách hàng, kho và chương trình khuyến mãi.</p></div><a class="btn outline" href="dashboard.html">← Tổng quan</a></header><nav class="tabs"><button class="active" data-type="orders">Đơn hàng</button><button data-type="customers">Khách hàng</button><button data-type="inventory">Kho hàng</button><button data-type="promotions">Khuyến mãi</button><button data-type="categories">Danh mục</button></nav><section class="manager-panel"><div id="notice" class="notice"></div><div id="form-area"></div><div class="table-scroll"><table class="manager-table"><thead id="table-head"></thead><tbody id="table-body"><tr><td>Đang tải dữ liệu…</td></tr></tbody></table></div></section></div></main>
<script>
const API='../../backend/api/';let type='orders';const $=s=>document.querySelector(s);const money=n=>Number(n||0).toLocaleString('vi-VN')+' ₫';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt});const j=await r.json();if(!r.ok||j.thanh_cong===false)throw Error(j.thong_bao||'Không thể tải dữ liệu');return j}
function message(s){$('#notice').textContent=s;$('#notice').style.display='block'}
async function load(){try{let rows;if(type==='orders'){rows=(await request(API+'manage_orders.php')).data;$('#form-area').innerHTML='';$('#table-head').innerHTML='<tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày tạo</th><th>Tổng tiền</th><th>Trạng thái</th><th>Cập nhật</th></tr>';$('#table-body').innerHTML=rows.map(x=>`<tr><td><b>${esc(x.ma_don_hang)}</b></td><td>${esc(x.ho_ten)}<br><small>${esc(x.email)}</small></td><td>${esc(x.ngay_tao)}</td><td>${money(x.tong_tien)}</td><td>${esc(x.trang_thai)}</td><td><select id="st-${x.id}">${['Đang xử lý','Đã xác nhận','Đang giao','Hoàn thành','Đã hủy'].map(s=>`<option ${s===x.trang_thai?'selected':''}>${s}</option>`).join('')}</select> <button class="manager-btn" onclick="saveOrder(${x.id})">Lưu</button></td></tr>`).join('')||'<tr><td colspan="6">Chưa có đơn hàng.</td></tr>'}
else {rows=(await request(API+'admin_manage.php?type='+type)).data;if(type==='customers'){$('#form-area').innerHTML='';$('#table-head').innerHTML='<tr><th>Khách hàng</th><th>Tên đăng nhập</th><th>Điện thoại</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr>';$('#table-body').innerHTML=rows.map(x=>`<tr><td>${esc(x.ho_ten)}<br><small>${esc(x.email)}</small></td><td>${esc(x.ten_dang_nhap)}</td><td>${esc(x.so_dien_thoai)}</td><td>${esc(x.vai_tro)}</td><td>${esc(x.trang_thai)}</td><td>${x.vai_tro==='khach_hang'?`<button class="manager-btn light" onclick="customerStatus(${x.id},'${x.trang_thai==='khoa'?'hoat_dong':'khoa'}')">${x.trang_thai==='khoa'?'Mở khóa':'Khóa'}</button>`:'—'}</td></tr>`).join('')}
if(type==='inventory'){$('#form-area').innerHTML='';$('#table-head').innerHTML='<tr><th>Mã SP</th><th>Sản phẩm</th><th>Tồn kho</th><th>Cập nhật số lượng</th></tr>';$('#table-body').innerHTML=rows.map(x=>`<tr><td>${esc(x.ma_san_pham)}</td><td>${esc(x.ten_san_pham)}</td><td>${x.so_luong_ton}</td><td><input type="number" min="0" id="qty-${x.id}" value="${x.so_luong_ton}"> <button class="manager-btn" onclick="saveStock(${x.id})">Lưu kho</button></td></tr>`).join('')}
if(type==='promotions'){$('#form-area').innerHTML='<form class="manager-form" id="promo-form"><label>Mã giảm giá<input name="ma_giam_gia" required placeholder="MAY10"></label><label>Phần trăm giảm<input name="phan_tram_giam" type="number" min="1" max="90" required placeholder="10"></label><label>Ngày hết hạn<input name="ngay_het_han" type="date"></label><button class="manager-btn">Tạo mã</button></form>';$('#promo-form').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));await request(API+'admin_manage.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'promotion',...d})});message('Đã tạo mã khuyến mãi.');load()}catch(x){message(x.message)}};$('#table-head').innerHTML='<tr><th>Mã</th><th>Mức giảm</th><th>Ngày hết hạn</th></tr>';$('#table-body').innerHTML=rows.map(x=>`<tr><td><b>${esc(x.ma_giam_gia)}</b></td><td>${x.phan_tram_giam}%</td><td>${esc(x.ngay_het_han||'Không giới hạn')}</td></tr>`).join('')||'<tr><td colspan="3">Chưa có mã giảm giá.</td></tr>'}
if(type==='categories'){$('#form-area').innerHTML='';$('#table-head').innerHTML='<tr><th>Danh mục</th><th>Số sản phẩm</th></tr>';$('#table-body').innerHTML=rows.map(x=>`<tr><td>${esc(x.danh_muc)}</td><td>${x.so_san_pham}</td></tr>`).join('')||'<tr><td colspan="2">Chưa có danh mục.</td></tr>'}}
}catch(e){$('#table-body').innerHTML=`<tr><td>${esc(e.message)}</td></tr>`;message(e.message)}}
async function post(data){return request(API+'admin_manage.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}async function saveOrder(id){try{await request(API+'manage_orders.php',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,trang_thai:$('#st-'+id).value})});message('Đã cập nhật đơn hàng.');load()}catch(e){message(e.message)}}async function saveStock(id){try{await post({action:'stock',id,so_luong_ton:$('#qty-'+id).value});message('Đã cập nhật tồn kho.');load()}catch(e){message(e.message)}}async function customerStatus(id,trang_thai){try{await post({action:'customer_status',id,trang_thai});message('Đã cập nhật tài khoản.');load()}catch(e){message(e.message)}}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;$('#notice').style.display='none';load()});load();
</script></body></html>
